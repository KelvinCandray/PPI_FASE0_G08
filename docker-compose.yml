services:
  redis:
    image: redis:alpine
    container_name: redis-cluster
    ports:
      - "6379:6379"

  backend1:
    build: ./backend
    environment:
      - NODE_NAME=Nodo-01
      - NODE_IP=127.0.0.1
      - PORT=3000
    depends_on:
      - redis

  backend2:
    build: ./backend
    environment:
      - NODE_NAME=Nodo-02
      - NODE_IP=127.0.0.2
      - PORT=3000
    depends_on:
      - redis

  backend3:
    build: ./backend
    environment:
      - NODE_NAME=Nodo-03
      - NODE_IP=127.0.0.3
      - PORT=3000
    depends_on:
      - redis

  frontend-proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend1
      - backend2
      - backend3