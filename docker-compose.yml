version: '3.8'

services:
  redis-server:
    image: redis:alpine
    container_name: redis-cluster

  backend1:
    build: ./backend
    environment:
      - PORT=3000
      - NODE_NAME=Nodo-01
      - REDIS_URL=redis://redis-server:6379
      - APP_ENV=intranet

  backend2:
    build: ./backend
    environment:
      - PORT=3000
      - NODE_NAME=Nodo-02
      - REDIS_URL=redis://redis-server:6379
      - APP_ENV=intranet

  backend3:
    build: ./backend
    environment:
      - PORT=3000
      - NODE_NAME=Nodo-03
      - REDIS_URL=redis://redis-server:6379
      - APP_ENV=intranet

  frontend-proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend1
      - backend2
      - backend3